name: Build, test, and deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write     # required for OIDC token exchange with Azure AD
  contents: read

env:
  RG: bronnoysund-mvp-rg
  ACR: bronnoysundmvp04726
  ENV_DOMAIN: redpebble-469bb928.norwayeast.azurecontainerapps.io
  # Opt in to Node.js 24 for JS-based actions now (default from June 2026).
  # Silences the Node.js 20 deprecation notice on checkout / setup-dotnet / azure-login.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --nologo -c Release

      - name: Test
        run: dotnet test --no-build --nologo -c Release --logger "console;verbosity=normal"

  deploy-blazorweb:
    name: Deploy BlazorWeb (UI + /api)
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      APP: bronnoysund-mvp
      DOCKERFILE: src/Bronnoysund.BlazorWeb/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC, federated credential)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in ACR
        run: |
          az acr build \
            --registry "$ACR" \
            --image "${APP}:${{ github.sha }}" \
            --image "${APP}:latest" \
            --file "$DOCKERFILE" \
            .

      - name: Update Container App
        run: |
          az containerapp update \
            --name "$APP" \
            --resource-group "$RG" \
            --image "${ACR}.azurecr.io/${APP}:${{ github.sha }}" \
            --query "properties.latestRevisionName" \
            -o tsv

      - name: Smoke test
        run: |
          URL="https://${APP}.${ENV_DOMAIN}"
          HTTP_CODE="000"
          for i in $(seq 1 12); do
            HTTP_CODE="$(curl -fsS --max-time 10 -o /dev/null -w "%{http_code}" "$URL/" 2>/dev/null || echo "000")"
            if [[ "$HTTP_CODE" == "200" ]]; then
              echo "Live: $URL ($HTTP_CODE) after ${i} attempt(s)"
              echo "DEPLOY_URL=$URL" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Attempt $i: HTTP $HTTP_CODE — waiting 10s..."
            sleep 10
          done
          echo "Smoke test failed after 12 attempts (~2 min): final HTTP $HTTP_CODE" >&2
          exit 1

      - name: Deploy summary
        if: success()
        run: |
          {
            echo "## Deployed BlazorWeb"
            echo ""
            echo "- **Image**: \`${ACR}.azurecr.io/${APP}:${{ github.sha }}\`"
            echo "- **Live**: <${DEPLOY_URL}/>"
            echo "- **JSON API**: <${DEPLOY_URL}/api/companies/919300388>"
            echo "- **Triggered by**: @${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-webapi:
    name: Deploy WebApi (JSON only)
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      APP: bronnoysund-webapi
      DOCKERFILE: src/Bronnoysund.WebApi/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC, federated credential)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Skip if Container App not provisioned
        id: precheck
        run: |
          if az containerapp show --name "$APP" --resource-group "$RG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Container App '$APP' not found in '$RG'. Skipping deploy. See deploy/README.md for one-time provisioning steps."
          fi

      - name: Build image in ACR
        if: steps.precheck.outputs.exists == 'true'
        run: |
          az acr build \
            --registry "$ACR" \
            --image "${APP}:${{ github.sha }}" \
            --image "${APP}:latest" \
            --file "$DOCKERFILE" \
            .

      - name: Update Container App
        if: steps.precheck.outputs.exists == 'true'
        run: |
          az containerapp update \
            --name "$APP" \
            --resource-group "$RG" \
            --image "${ACR}.azurecr.io/${APP}:${{ github.sha }}" \
            --query "properties.latestRevisionName" \
            -o tsv

      - name: Smoke test
        if: steps.precheck.outputs.exists == 'true'
        run: |
          URL="https://${APP}.${ENV_DOMAIN}"
          HTTP_CODE="000"
          for i in $(seq 1 12); do
            HTTP_CODE="$(curl -fsS --max-time 10 -o /dev/null -w "%{http_code}" "$URL/health" 2>/dev/null || echo "000")"
            if [[ "$HTTP_CODE" == "200" ]]; then
              echo "Live: $URL/health ($HTTP_CODE) after ${i} attempt(s)"
              echo "DEPLOY_URL=$URL" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Attempt $i: HTTP $HTTP_CODE on /health — waiting 10s..."
            sleep 10
          done
          echo "Smoke test failed after 12 attempts (~2 min): final HTTP $HTTP_CODE" >&2
          exit 1

      - name: Deploy summary
        if: steps.precheck.outputs.exists == 'true' && success()
        run: |
          {
            echo "## Deployed WebApi"
            echo ""
            echo "- **Image**: \`${ACR}.azurecr.io/${APP}:${{ github.sha }}\`"
            echo "- **Health**: <${DEPLOY_URL}/health>"
            echo "- **Lookup**: <${DEPLOY_URL}/companies/919300388>"
            echo "- **Triggered by**: @${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"
